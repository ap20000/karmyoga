<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter Viewer | Karmayog Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
  </head>

  <body>
    <!-- Navigation -->
    <karmayog-navbar base-path="../"></karmayog-navbar>

    <!-- Header & Breadcrumbs Section -->
    <section
      class="section"
      style="
        padding-top: 150px;
        padding-bottom: 2rem;
        background: var(--bg-secondary);
      "
    >
      <div class="container animate-up">
        <!-- Breadcrumbs -->
        <nav class="breadcrumbs" aria-label="Breadcrumb" style="margin-top: 0">
          <a href="../index.html">Home</a>
          <span class="separator">/</span>
          <span
            id="breadcrumb-title"
            style="color: var(--text-primary); font-weight: 600"
            >Newsletter Viewer</span
          >
        </nav>

        <h1
          id="page-title"
          style="
            max-width: 900px;
            line-height: 1.1;
            font-size: 2.5rem;
            margin-top: 1rem;
          "
        >
          Issue <span class="text-gradient">Viewer</span>
        </h1>
      </div>
    </section>

    <!-- PDF Viewer Section -->
    <section class="section">
      <div class="container animate-up delay-1">
        <div
          class="card"
          style="
            padding: 1rem;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
          "
        >
          <!-- PDF Frame Container -->
          <div
            style="
              flex-grow: 1;
              width: 100%;
              height: 100%;
              background: #222;
              border-radius: var(--radius-md);
              overflow: hidden;
              position: relative;
            "
          >
            <!-- Default Placeholder if no PDF provided -->
            <div
              id="pdf-placeholder"
              style="
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 2rem;
              "
            >
              <svg
                width="64"
                height="64"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--color-primary-teal)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="margin-bottom: 1rem; opacity: 0.8"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                ></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              <h3
                style="
                  font-size: 1.5rem;
                  margin-bottom: 0.5rem;
                  color: var(--text-primary);
                "
              >
                Document Reader
              </h3>
              <p
                style="
                  color: var(--text-secondary);
                  max-width: 400px;
                  margin: 0 auto;
                "
              >
                Reading embedded newsletter PDF files.
              </p>
            </div>

            <!-- The actual iframe used for the PDF -->
            <!-- 
              Note: You would replace the src with actual PDF paths based on the query param. 
              Modern browsers handle PDFs in iframes natively.
            -->
            <iframe
              id="pdf-frame"
              src=""
              width="100%"
              height="100%"
              style="
                border: none;
                position: relative;
                z-index: 10;
                display: none;
              "
            ></iframe>
          </div>
        </div>
      </div>
    </section>

    <karmayog-footer base-path="../"></karmayog-footer>

    <script src="../js/main.js"></script>
    <script>
      // Simple logic to read the '?issue=' parameter and set titles/PDFs
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const issueParam = urlParams.get("issue");

        const titleEl = document.getElementById("page-title");
        const breadcrumbEl = document.getElementById("breadcrumb-title");
        const pdfFrame = document.getElementById("pdf-frame");
        const placeholder = document.getElementById("pdf-placeholder");

        if (issueParam === "Feb-2024") {
          titleEl.innerHTML =
            'February 2024 <span class="text-gradient">Newsletter</span>';
          breadcrumbEl.textContent = "February 2024";
          // Set real PDF path here if you have one. Leaving blank will just show browser PDF tools or fail if empty.
          // pdfFrame.src = '../assets/newsletters/feb-2024.pdf';
          // pdfFrame.style.display = 'block';
        } else if (issueParam === "Jan-2024") {
          titleEl.innerHTML =
            'January 2024 <span class="text-gradient">Newsletter</span>';
          breadcrumbEl.textContent = "January 2024";
          // pdfFrame.src = '../assets/newsletters/jan-2024.pdf';
          // pdfFrame.style.display = 'block';
        }

        // Just for visual completeness in this demo, let's pretend a PDF is loading
        // Remove this setTimeout logic when you connect real PDF URLs above
        if (issueParam) {
          setTimeout(() => {
            placeholder.querySelector("h3").textContent =
              "PDF Viewer Loading...";
            placeholder.querySelector("p").textContent =
              "Connect actual .pdf paths in pdf_viewer.html to view documents natively.";
          }, 500);
        }
      });
    </script>
  </body>
</html>
